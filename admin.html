<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Real Astro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f5f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #100b38; margin-top: 0; margin-bottom: 15px; font-size: 18px; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins'; font-size: 14px; }
        button { color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 14px; transition: all 0.3s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(to right, #ff9933, #e68a00); }
        .btn-red { background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-gray { background: #64748b; }
        .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 250px; overflow-y: auto; margin-bottom: 15px; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;}
        .slot-label { font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .action-row { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #100b38; font-size: 22px; margin-bottom: 24px;">✨ Real Astro Admin</h1>

        <!-- 1. LIVE STREAM CONTROL -->
        <div class="card" style="border: 2px solid #fca5a5; background: #fff5f5;">
            <h2 style="color: #b91c1c;">🔴 Live Stream Control</h2>
            <input type="text" id="live-topic" placeholder="Topic (e.g. Career & Wealth Guidance)" />
            <input type="text" id="live-time" placeholder="Schedule (e.g. Today at 8:00 PM)" />
            <button class="btn-primary" onclick="window.updateSchedule()">📅 Update Schedule (Offline)</button>
            <button class="btn-red" onclick="window.startLive()">📺 Go LIVE Now</button>
            <button class="btn-gray" onclick="window.endLive()">⏹️ End Live / Reset</button>
        </div>

        <!-- 2. DAILY REMEDY -->
        <div class="card">
            <h2>✨ Daily Remedy Update</h2>
            <input type="text" id="rem-title" placeholder="Remedy Title" />
            <textarea id="rem-desc" rows="3" placeholder="Remedy Description"></textarea>
            <div class="action-row">
                <button class="btn-primary" onclick="window.updateRemedy()" style="flex: 2;">Update Remedy</button>
                <button class="btn-gray" onclick="window.removeRemedy()" style="flex: 1; background: #94a3b8; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">🗑️ Remove</button>
            </div>
        </div>

        <!-- 3. SLOTS MANAGEMENT (MODIFIED) -->
        <div class="card">
            <h2>📅 Manage Available Slots</h2>
            <input type="date" id="slot-date" />
            <div class="slot-grid" id="slots-container"></div>
            <button class="btn-primary" onclick="window.saveSlots()">Save Slots for Date</button>
        </div>

        <!-- 🌟 RECENT BOOKINGS TRACKER -->
        <div class="card">
            <h2>📋 Recent Bookings</h2>
            <p style="font-size: 12px; color: #64748b; margin-top: 0; margin-bottom: 12px;">Check your bank SMS for payment confirmation before joining.</p>
            <div id="admin-bookings-list" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <div style="font-size: 13px; color: #64748b; text-align: center;">Loading bookings...</div>
            </div>
        </div>
        
        <!-- 4. JOIN 1-ON-1 CALL -->
        <div class="card">
            <h2>📞 Join 1-on-1 Consultation</h2>
            <p style="font-size: 12px; color: #64748b; margin-top: 0;">Enter client's name to connect to their private room.</p>
            <input type="text" id="client-name" placeholder="Client Name (e.g. Rahul)" />
            <button class="btn-primary" onclick="window.joinOneOnOne()">Join Video Call</button>
        </div>
    </div>

    <!-- ZEGOCLOUD SDK -->
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbHdnVt9ST7vbJpEA1B8f76FglZo5zfav",
            authDomain: "real-astro-c8d6e.firebaseapp.com",
            projectId: "real-astro-c8d6e",
            storageBucket: "real-astro-c8d6e.appspot.com",
            messagingSenderId: "972015683245",
            appId: "1-972015683245-web:f4279a5b783d923of3a824"
        });
        const db = getFirestore(app);

        // --- LIVE STREAM LOGIC ---
        window.updateSchedule = async () => {
            const topic = document.getElementById('live-topic').value;
            const time = document.getElementById('live-time').value;
            if(!topic || !time) return alert("Please enter both Topic and Schedule Time.");
            await setDoc(doc(db, "live_status", "main"), { isLive: false, topic: topic, scheduleTime: time });
            alert("Schedule updated successfully! It is now visible on the Client App.");
        };

        window.startLive = async () => {
            await setDoc(doc(db, "live_status", "main"), { isLive: true, topic: "LIVE NOW", scheduleTime: "LIVE NOW" });
            alert("You are now LIVE! Opening Studio...");
            
            const appID = 1009897816;
            const roomID = "real_astro_live_room";
            const userID = "admin_host_" + Math.floor(Math.random() * 1000);
            const userName = "Acharya Subhadip (Host)";
            
            const token = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, "30cf208a168057120577256aa90fba8c", roomID, userID, userName);
            
            const zp = ZegoUIKitPrebuilt.create(token);
            zp.joinRoom({
                container: document.body,
                scenario: { mode: ZegoUIKitPrebuilt.LiveStreaming, config: { role: ZegoUIKitPrebuilt.Host } },
                showTurnOffRemoteCameraButton: true,
                showTurnOffRemoteMicrophoneButton: true,
                showRemoveUserButton: true
            });
        };

        window.endLive = async () => {
            await setDoc(doc(db, "live_status", "main"), { isLive: false, topic: "", scheduleTime: "Currently Offline" });
            alert("Live ended! Client app will reset to normal.");
            location.reload();
        };

        // --- REMEDY LOGIC ---
        window.updateRemedy = async () => {
            const title = document.getElementById('rem-title').value;
            const desc = document.getElementById('rem-desc').value;
            if(!title || !desc) return alert("Fill both fields!");
            await setDoc(doc(db, "remedies", "latest"), { title, desc });
            alert("Remedy Updated!");
        };

        window.removeRemedy = async () => {
            if(confirm("Are you sure you want to remove the current remedy?")) {
                try {
                    await deleteDoc(doc(db, "remedies", "latest"));
                    document.getElementById('rem-title').value = '';
                    document.getElementById('rem-desc').value = '';
                    alert("Remedy Removed Successfully! It will no longer appear on your client website.");
                } catch(e) { console.error("Error removing remedy:", e); }
            }
        };

        // --- SLOTS LOGIC (MODIFIED FOR MARK BOOKED) ---
        const timeSlots = [];
        for(let h=0; h<24; h++) {
            for(let m=0; m<60; m+=30) {
                let ampm = h >= 12 ? 'PM' : 'AM'; let hour12 = h % 12 || 12; let mins = m === 0 ? '00' : '30';
                let nextH = m === 30 ? h + 1 : h; let nextM = m === 30 ? 0 : 30;
                let nextAmpm = (nextH % 24) >= 12 ? 'PM' : 'AM'; let nextHour12 = (nextH % 12) || 12; let nextMins = nextM === 0 ? '00' : '30';
                timeSlots.push({ label: `${hour12}:${mins} ${ampm} - ${nextHour12}:${nextMins} ${nextAmpm}`, key: `slot_${h.toString().padStart(2,'0')}${mins}` });
            }
        }

        const slotContainer = document.getElementById('slots-container');
        timeSlots.forEach(s => {
            slotContainer.innerHTML += `
            <div style="display: flex; flex-direction: column; gap: 4px; background: white; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                <span style="font-size: 12px; font-weight: 600; color: #100b38;">${s.label}</span>
                <select id="${s.key}" style="padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #cbd5e1; outline: none;">
                    <option value="">Off (Hidden)</option>
                    <option value="true">🟢 Available</option>
                    <option value="booked">🔴 Booked</option>
                </select>
            </div>`;
        });

        const dateInput = document.getElementById('slot-date');
        dateInput.value = new Date().toISOString().split('T')[0];

        const loadAdminSlots = async () => {
            const date = dateInput.value;
            if(!date) return;
            // Reset all to Off
            timeSlots.forEach(s => document.getElementById(s.key).value = "");
            
            const docSnap = await getDoc(doc(db, "availability_dates", date));
            if(docSnap.exists()) {
                const data = docSnap.data();
                timeSlots.forEach(s => { 
                    if(data[s.key] === true) document.getElementById(s.key).value = "true"; 
                    else if(data[s.key] === "booked") document.getElementById(s.key).value = "booked"; 
                });
            }
        };
        
        dateInput.addEventListener('change', loadAdminSlots);
        loadAdminSlots();

        window.saveSlots = async () => {
            const date = dateInput.value;
            if(!date) return alert("Select a date!");
            const data = {};
            timeSlots.forEach(s => { 
                const val = document.getElementById(s.key).value;
                if (val === "true") data[s.key] = true;
                else if (val === "booked") data[s.key] = "booked";
            });
            await setDoc(doc(db, "availability_dates", date), data);
            alert("Slots saved for " + date);
        };

        // --- BOOKINGS LISTENER ---
        const bookingsQ = query(collection(db, "bookings"), orderBy("timestamp", "desc"), limit(20));
        onSnapshot(bookingsQ, (snapshot) => {
            const list = document.getElementById('admin-bookings-list');
            list.innerHTML = '';
            if (snapshot.empty) {
                list.innerHTML = '<div style="font-size: 13px; color: #64748b; text-align: center; padding: 10px;">No recent bookings yet.</div>';
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const bookedAt = new Date(data.timestamp).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true, month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                
                const phoneHtml = data.clientPhone ? `<span style="font-weight: normal; color: #0284c7; font-size: 13px; float: right;">📞 ${data.clientPhone}</span>` : '';

                list.innerHTML += `
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; text-align: left;">
                        <div style="font-weight: 700; color: #100b38; font-size: 14.5px; margin-bottom: 4px;">👤 Client: ${data.clientName} ${phoneHtml}</div>
                        <div style="font-size: 12.5px; color: #475569; margin-bottom: 2px;">📅 <b>Date:</b> ${data.date}</div>
                        <div style="font-size: 12.5px; color: #475569; margin-bottom: 2px;">⏰ <b>Slot:</b> ${data.slot}</div>
                        <div style="font-size: 12.5px; color: #27ae60; margin-bottom: 2px;">💳 <b>Plan:</b> ${data.planMinutes} Mins (₹${data.planAmount}) - ${data.paymentMethod}</div>
                        <div style="font-size: 11px; color: #94a3b8; margin-top: 6px; text-align: right;">Booked on: ${bookedAt}</div>
                    </div>
                `;
            });
        });

        // --- 1-ON-1 CALL LOGIC ---
        window.joinOneOnOne = () => {
            const clientName = document.getElementById('client-name').value.trim();
            if(!clientName) return alert("Enter client name to connect to their room!");
            
            const appID = 1009897816;
            const roomID = "real_astro_consultation_room";
            const userID = "admin_private_" + Math.floor(Math.random() * 1000);
            const userName = "Acharya Subhadip";
            
            const token = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, "30cf208a168057120577256aa90fba8c", roomID, userID, userName);
            const zp = ZegoUIKitPrebuilt.create(token);
            
            zp.joinRoom({ container: document.body, scenario: { mode: ZegoUIKitPrebuilt.VideoConference }});
        };
    </script>
</body>
</html>
