<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Astro - Client Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #100b38;
            --primary-accent: #2a0845;
            --gold: #ffd700;
            --bg-color: #f4f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: #333; }
        
        .header { background: linear-gradient(135deg, var(--primary-dark), var(--primary-accent)); color: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--gold); }
        .header h1 { font-size: 24px; color: var(--gold); }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { color: var(--primary-dark); font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        .remedy-box { background: #fffbeb; border-left: 4px solid var(--gold); padding: 15px; border-radius: 8px; }
        .remedy-title { font-weight: 600; color: #b45309; margin-bottom: 5px; }
        .remedy-desc { font-size: 14px; color: #451a03; }

        .slot { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; }
        .slot-time { font-weight: 600; color: var(--primary-dark); font-size: 15px; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white; background: #27ae60; transition: 0.2s; font-size: 14px; }
        .btn.disabled { background: #cbd5e1; cursor: not-allowed; color: #64748b; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕉️ Real Astro</h1>
        <p style="font-size: 14px; opacity: 0.9;">Consult Acharya Subhadip</p>
    </div>

    <div class="container">
        
        <!-- Live Remedy Section -->
        <div class="card">
            <h2>Today's Guidance & Remedy</h2>
            <div class="remedy-box" id="remedy-container">
                <div class="remedy-title" id="remedy-title">Loading...</div>
                <div class="remedy-desc" id="remedy-desc">Fetching latest guidance...</div>
            </div>
        </div>

        <!-- Live Booking Section -->
        <div class="card">
            <h2>Book a Consultation</h2>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Live availability status:</p>
            
            <div class="slot">
                <span class="slot-time">11:00 AM - 11:30 AM</span>
                <button id="btn-1100" class="btn disabled">Checking...</button>
            </div>
            <div class="slot">
                <span class="slot-time">11:30 AM - 12:00 PM</span>
                <button id="btn-1130" class="btn disabled">Checking...</button>
            </div>
            <div class="slot">
                <span class="slot-time">12:00 PM - 12:30 PM</span>
                <button id="btn-1200" class="btn disabled">Checking...</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE CLIENT SCRIPT (Real-Time Listener) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbHdnVt9ST7vbJpEA1B8f76FglZo5zfav",
            authDomain: "real-astro-c8d6e.firebaseapp.com",
            projectId: "real-astro-c8d6e",
            storageBucket: "real-astro-c8d6e.appspot.com",
            messagingSenderId: "972015683245",
            appId: "1-972015683245-web:f4279a5b783d923of3a824",
            measurementId: "G-5F29HE5B1D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // REAL-TIME AVAILABILITY SYNC
        onSnapshot(doc(db, "settings", "availability"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                updateButton('btn-1100', data.slot1100);
                updateButton('btn-1130', data.slot1130);
                updateButton('btn-1200', data.slot1200);
            }
        });

        function updateButton(btnId, isAvailable) {
            const btn = document.getElementById(btnId);
            if (isAvailable) {
                btn.className = "btn"; 
                btn.innerText = "Book Now";
                btn.onclick = () => alert("Proceeding to Chat / Payment...");
            } else {
                btn.className = "btn disabled"; 
                btn.innerText = "Unavailable";
                btn.onclick = null;
            }
        }

        // REAL-TIME REMEDY SYNC
        onSnapshot(doc(db, "remedies", "latest"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('remedy-title').innerText = data.title;
                document.getElementById('remedy-desc').innerText = data.desc;
            } else {
                document.getElementById('remedy-title').innerText = "No updates yet";
                document.getElementById('remedy-desc').innerText = "Please check back later.";
            }
        });
    </script>
</body>
</html>
